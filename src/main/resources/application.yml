server:
port: 8080
servlet:
encoding:
charset: UTF-8
enabled: true
force: true

spring:
application:
name: campus-eats
datasource:
url: jdbc:h2:file:./data/campuseats_db;AUTO_SERVER=TRUE;MODE=PostgreSQL
driver-class-name: org.h2.Driver
username: sa
password:
jpa:
database-platform: org.hibernate.dialect.H2Dialect
hibernate:
ddl-auto: update
show-sql: false
open-in-view: false
h2:
console:
enabled: true
path: /h2-console

springdoc:
api-docs:
path: /api-docs
swagger-ui:
path: /swagger-ui.html
operationsSorter: method
tagsSorter: alpha
